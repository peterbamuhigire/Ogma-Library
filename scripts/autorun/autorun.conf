# Per-repository settings for scripts/autorun/run_plan.sh (sourced by bash). Everything is optional.
# Uncomment and edit only what this repository needs.

# MAX_HOURS=48                 # total run budget
# SESSION_TIMEOUT=3h           # one phase must finish inside this
# CLAUDE_MODEL=sonnet          # class N executes
# ESCALATE_MODEL=opus          # one session after a failure or an empty session
# DAILY_SESSION_CAP=0          # 0 = no cap
# PLAN_SKIP="plan-name-1 plan-name-2"   # folders under docs/plans that are not plans
# COPY_PATHS=""                # extra git-ignored files or folders to copy into the worktree
# CLEANUP_CMD=""               # run after each session, for example to stop test servers
# NOTIFY_CMD=""                # run at the end; the text is in $NOTIFY_MSG
# EXTRA_PROMPT="Tests: use the local test database named in this repository's docs; never a production database."
