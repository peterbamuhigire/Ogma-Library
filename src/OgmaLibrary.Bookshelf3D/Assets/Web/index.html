<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src ogma: data:; connect-src 'none';">
  <title>Ogma 3D Bookshelf</title>
  <style>
    html,
    body,

      width: 100%;
      height: 100%;

    }

<body>
  <canvas id="shelf3d-canvas" aria-label="3D bookshelf"></canvas>
  <script src="shelf3d.js"></script>
</body>
</html>
