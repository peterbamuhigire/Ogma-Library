<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src ogma: data:; connect-src 'none';">
  <title>Ogma 3D Bookshelf</title>
  <style>
    html,
    body,
    #shelf3d-canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5efe4;
    }

    #shelf3d-canvas:focus {
      outline: 3px solid #8b5e34;
      outline-offset: -3px;
    }

    #shelf3d-status {
      position: absolute;
      left: 12px;
      bottom: 10px;
      max-width: calc(100% - 24px);
      padding: 6px 10px;
      color: #f5efe4;
      background: rgba(39, 31, 25, 0.84);
      font: 15px Georgia, serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="shelf3d-canvas" aria-label="3D bookshelf"></canvas>
  <div id="shelf3d-status" role="status" aria-live="polite">Use arrow keys to browse books; press Enter to open.</div>
  <script src="shelf3d.js"></script>
</body>
</html>
