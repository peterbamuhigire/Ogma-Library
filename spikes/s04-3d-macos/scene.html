<!DOCTYPE html>
<!--
  Spike 4 — 500-spine WebGL2 scene for FPS measurement (THROWAWAY).
  Renders 500 textured PlaneGeometry "spines" (the NFR-OGMA-006 target scene)
  with a Stats.js FPS overlay. Open this in the target WebView to measure mean
  FPS over 10 s:
    - macOS 13+ WKWebView on the reference hardware (M-REF-01, M1 8 GB)  <-- the gate
    - Windows WebView2 (secondary reference)
  Pass: mean FPS >= 60. Fail (<45): triggers an ADR-0003 amendment.
  The on-screen readout reports mean FPS once 10 s of samples are collected.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ogma Spike 4 — 500 spines</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2b211a; overflow: hidden; }
    #readout {
      position: fixed; left: 8px; bottom: 8px; z-index: 10;
      font: 13px/1.4 ui-monospace, monospace; color: #f4e9d8;
      background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="readout">collecting 10 s of frames…</div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import Stats from 'https://unpkg.com/three@0.160.0/examples/jsm/libs/stats.module.js';

    const COUNT = 500;                 // NFR-OGMA-006 target scene size
    const SPINE_W = 0.18, SPINE_H = 1.0, SPINE_D = 0.02;

    const stats = new Stats();
    document.body.appendChild(stats.dom);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Confirm WebGL2 — the capability the host checks before using the 3D shelf.
    const isWebGL2 = renderer.capabilities.isWebGL2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b211a);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 14);

    // A small set of solid-colour "spine" textures (stand-ins for generated WebP).
    const palette = [0xb5651d, 0x355070, 0x6d9773, 0xa44a3f, 0x7d5ba6, 0x4f5d75];
    function spineTexture(color) {
      const c = document.createElement('canvas'); c.width = 64; c.height = 96;
      const g = c.getContext('2d');
      g.fillStyle = '#' + color.toString(16).padStart(6, '0'); g.fillRect(0, 0, 64, 96);
      g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0, 0, 64, 10);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    const mats = palette.map(c => new THREE.MeshBasicMaterial({ map: spineTexture(c) }));
    const geo = new THREE.BoxGeometry(SPINE_W, SPINE_H, SPINE_D);

    // Lay the 500 spines out across several shelves.
    const perShelf = 50, gap = 0.02, shelfGapY = 1.3;
    let i = 0;
    for (let shelf = 0; i < COUNT; shelf++) {
      for (let col = 0; col < perShelf && i < COUNT; col++, i++) {
        const m = new THREE.Mesh(geo, mats[i % mats.length]);
        m.position.x = (col - perShelf / 2) * (SPINE_W + gap);
        m.position.y = (3 - shelf) * shelfGapY;
        scene.add(m);
      }
    }

    addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // FPS sampling over a 10 s window.
    const readout = document.getElementById('readout');
    let frames = 0; const start = performance.now();
    let reported = false;
    function animate() {
      requestAnimationFrame(animate);
      scene.rotation.y = Math.sin(performance.now() / 4000) * 0.15; // gentle motion
      renderer.render(scene, camera);
      stats.update();
      frames++;
      const elapsed = (performance.now() - start) / 1000;
      if (!reported && elapsed >= 10) {
        reported = true;
        const mean = (frames / elapsed).toFixed(1);
        readout.textContent =
          `WebGL2: ${isWebGL2 ? 'yes' : 'NO'} · spines: ${COUNT} · mean FPS over ${elapsed.toFixed(0)}s: ${mean}` +
          ` · gate ≥60: ${mean >= 60 ? 'PASS' : (mean >= 45 ? 'MARGINAL' : 'FAIL')}`;
        // Report back over the bridge if hosted (Spike 3 contract).
        if (window.chrome?.webview) window.chrome.webview.postMessage(
          JSON.stringify({ type: 'fpsResult', data: { meanFps: Number(mean), webgl2: isWebGL2, count: COUNT } }));
      }
    }
    animate();
  </script>
</body>
</html>
