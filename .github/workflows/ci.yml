name: CI

# Ogma Library continuous integration.
# Every PR to develop/main must be green on BOTH Windows and macOS before merge
# (Phase 02 DoD; cross-platform parity is a hard gate).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/shelf3d/package-lock.json

      - name: Requirement accountability gate
        shell: pwsh
        run: ./scripts/Test-RequirementAccountability.ps1

      - name: Restore
        run: dotnet restore OgmaLibrary.sln --locked-mode

      - name: Format check
        run: dotnet format OgmaLibrary.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build OgmaLibrary.sln --configuration Release --no-restore

      - name: Dependency vulnerability scan
        run: dotnet list OgmaLibrary.sln package --vulnerable --include-transitive

      - name: SAST analyzer scan
        run: dotnet format analyzers OgmaLibrary.sln --verify-no-changes --no-restore --severity warn --verbosity minimal

      - name: Install and audit 3D dependencies
        run: |
          npm ci --prefix src/shelf3d
          npm audit --prefix src/shelf3d --audit-level=low

      - name: Verify 3D source and performance budget
        run: |
          npm run typecheck --prefix src/shelf3d
          npm run build --prefix src/shelf3d
          npm run perf:budget --prefix src/shelf3d
          git diff --exit-code -- src/OgmaLibrary.Bookshelf3D/Assets/Web/shelf3d.js

      - name: Secret pattern scan
        shell: pwsh
        run: |
          $patterns = @(
            'sk_live_[A-Za-z0-9]{16,}',
            'sk-[A-Za-z0-9]{20,}',
            'ghp_[A-Za-z0-9]{36}',
            'github_pat_[A-Za-z0-9_]{20,}',
            'AIza[0-9A-Za-z\-_]{35}',
            '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----'
          )
          $files = Get-ChildItem -Path src,.github -Recurse -File -Include *.cs,*.axaml,*.json,*.yml,*.yaml,*.props,*.csproj |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\|packages\.lock\.json|\\.github\\workflows\\ci\.yml$' }
          $hits = foreach ($pattern in $patterns) {
            Select-String -Path $files.FullName -Pattern $pattern -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.Path):$($_.LineNumber):$($_.Line.Trim())" }
          }
          if ($hits) {
            $hits
            exit 1
          }
          "No high-confidence secret patterns found."

      - name: Test (unit + architecture + UI render, excluding benchmarks)
        # Run test projects sequentially so latency budgets are not distorted by
        # competing architecture/UI test hosts on shared CI runners.
        # Category=Benchmark runs nightly (.github/workflows/nightly-benchmarks.yml).
        timeout-minutes: 20
        run: dotnet test OgmaLibrary.sln --configuration Release --no-build --verbosity normal -m:1 --filter "Category!=Benchmark&Category!=E2E"

      - name: Upload skeleton screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-screenshots-${{ matrix.os }}
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore

  # Sept-23 Phase 01 (T01.10): real-window golden journeys against the E2E hook build of the app
  # (built by the runner script; never used for shipped builds, see ADR-0017). NOT YET REQUIRED:
  # continue-on-error stays on until the owner-visible journeys (G1, G2) are green on the hosted
  # runner and the known failures in tests/OgmaLibrary.Tests.E2E/baseline.json are fixed by their
  # owning phases. Pixel thresholds may need tuning for hosted-runner DPI (a failure there is a
  # harness defect, not a pass). Evidence is uploaded as the e2e-evidence artefact.
  e2e-windows:
    name: real-window journeys (windows, informational)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      # Hosted runners have no user at the desk; pin the window so nothing can cover it.
      OGMA_E2E_TOPMOST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python (synthetic corpus generator)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install corpus generator dependencies
        run: python -m pip install pymupdf pypdf

      - name: Restore
        run: dotnet restore OgmaLibrary.sln --locked-mode

      - name: Generate the synthetic corpus
        shell: pwsh
        run: |
          $corpus = Join-Path $env:RUNNER_TEMP 'ogma-corpus'
          python tests/fixtures/corpus/New-SyntheticCorpus.py $corpus
          "OGMA_E2E_CORPUS=$corpus" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run golden journeys at 1280x800
        shell: pwsh
        run: ./tests/OgmaLibrary.Tests.E2E/Invoke-GoldenJourneys.ps1 -All -Sizes 1280x800 -RunId ci-${{ github.run_id }}

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: artifacts/e2e/
          if-no-files-found: warn

  # The hybrid validation gate (python -m engine validate Ogma-Library) runs where
  # the SDLC engine is available. It is tracked as TRACK-P00-GATE until wired here;
  # this placeholder documents the intended step without faking a pass.
  hybrid-gate:
    name: hybrid validation gate (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: echo "Hybrid gate engine is external (TRACK-P00-GATE); see docs/governance/HYBRID-GATE.md"
